[workspace]
resolver = "3"
members = ["engine", "shared", "server", "client", "rendezvous"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
engine = { path = "engine", default-features = false }
shared = { path = "shared" }
server = { path = "server" }
rendezvous = { path = "rendezvous" }

glam = { version = "0.33", features = ["serde", "bytemuck"] }
parry3d = "0.31"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
bincode = { version = "2", features = ["serde"] }
notify = "8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }

wgpu = "30"
winit = { version = "0.30", features = ["serde"] }
gilrs = "0.11"
kira = "0.12"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"

renet = "2"
renet_netcode = "2"

# Keep our own code quick to compile but make heavy dependencies (wgpu, parry, kira) fast at runtime.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
