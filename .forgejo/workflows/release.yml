# Checks, builds and publishes VELOCIDE: every push to main becomes a release `build-<n>`, and
# every `v*` tag a release under that tag, each with the Linux and Windows packages attached
# (`/releases/latest` always points at the newest). Older `build-*` releases are pruned (the
# newest 10 stay). Notes: docs/hosting.md ("Releases from CI").
#
# Runs on the `mac-studio-docker` runner in plain Ubuntu containers. Every step is a shell script
# in the repo (scripts/ci/*), so nothing is fetched from an action registry: the containers need
# only Ubuntu's archive, rustup and crates.io. The packages are x86_64 whatever the runner's
# architecture (an arm64 runner cross-compiles, scripts/ci/setup.sh).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # The toolchain every job installs (the version the game is developed with).
  RUST_VERSION: "1.97.1"
  RUSTUP_HOME: /usr/local/rustup
  CARGO_HOME: /usr/local/cargo
  PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  CARGO_TERM_COLOR: always
  FORGEJO_API: ${{ github.api_url }}
  FORGEJO_REPO: ${{ github.repository }}
  # The run's own token; a `RELEASE_TOKEN` secret (a token with repository write access) takes
  # its place if the instance limits what the automatic token may do.
  FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  # fmt, clippy and the whole test suite (natively: the tests don't care about the package
  # architecture). Nothing is released unless they pass.
  check:
    runs-on: mac-studio-docker
    container: ubuntu:24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        run: bash scripts/ci/setup.sh check
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # The release to fill: a draft until every package is attached.
  draft:
    needs: check
    runs-on: mac-studio-docker
    container: ubuntu:24.04
    timeout-minutes: 10
    outputs:
      id: ${{ steps.draft.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Version
        id: meta
        run: |
          short=${GITHUB_SHA:0:7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            title="VELOCIDE $GITHUB_REF_NAME"
          else
            version=build-$GITHUB_RUN_NUMBER
            title="VELOCIDE build $GITHUB_RUN_NUMBER ($short)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "title=$title" >>"$GITHUB_OUTPUT"
          {
            echo "Built from $short on \`${GITHUB_REF_NAME}\`: $(git log -1 --format=%s)"
            echo
            echo "Download the package for your system, unpack it and run \`velocide\` (\`velocide.exe\` on Windows); \`PLAY.txt\` inside explains hosting and joining. Everyone in a game, the server included, must run the same version (\`$version\`)."
          } >notes.md
      - name: Draft release
        id: draft
        run: |
          id=$(bash scripts/ci/forgejo_release.sh draft "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.title }}" "$GITHUB_SHA" notes.md)
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "draft release $id"

  linux:
    needs: draft
    runs-on: mac-studio-docker
    # 20.04 keeps the binaries on glibc 2.31 (any distro from about 2020 on).
    container: ubuntu:20.04
    timeout-minutes: 90
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        run: bash scripts/ci/setup.sh linux
      - name: Build
        run: VERSION="${{ needs.draft.outputs.version }}" bash scripts/build_dist.sh linux
      - name: Attach
        run: bash scripts/ci/forgejo_release.sh upload "${{ needs.draft.outputs.id }}" dist/*.tar.gz

  windows:
    needs: draft
    runs-on: mac-studio-docker
    container: ubuntu:24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        run: bash scripts/ci/setup.sh windows
      - name: Build
        run: VERSION="${{ needs.draft.outputs.version }}" bash scripts/build_dist.sh windows
      - name: Attach
        run: bash scripts/ci/forgejo_release.sh upload "${{ needs.draft.outputs.id }}" dist/*.zip

  publish:
    needs: [draft, linux, windows]
    runs-on: mac-studio-docker
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Publish
        run: bash scripts/ci/forgejo_release.sh publish "${{ needs.draft.outputs.id }}"
      - name: Prune old builds
        run: bash scripts/ci/forgejo_release.sh prune build- 10

  # A failed run leaves no draft behind.
  discard:
    needs: [draft, linux, windows, publish]
    if: ${{ failure() && needs.draft.outputs.id != '' }}
    runs-on: mac-studio-docker
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq >/dev/null
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="Authorization: Basic $(printf 'ci:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA" ||
            git -c http.extraHeader="$auth" fetch -q --depth 1 origin "$GITHUB_REF"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Discard the draft
        run: bash scripts/ci/forgejo_release.sh discard "${{ needs.draft.outputs.id }}"
