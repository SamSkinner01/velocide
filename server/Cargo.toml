[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "velocide-server"
path = "src/main.rs"

[dependencies]
engine.workspace = true
shared.workspace = true
rendezvous.workspace = true
glam.workspace = true
serde.workspace = true
ron.workspace = true
bincode.workspace = true
renet.workspace = true
renet_netcode.workspace = true
# netcode protocol core: our transports wrap it directly so the network simulator can sit
# between the UDP socket and netcode (see docs/network.md).
renetcode = "2"
ctrlc = "3"
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Integration tests (tests/combat_net.rs) drive real clients against a real server.
client = { path = "../client" }
