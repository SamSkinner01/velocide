[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "velocide"
path = "src/main.rs"

[features]
default = ["debug-ui"]
# egui debug overlay (tuning editor, net graphs). Disable with --no-default-features.
debug-ui = ["engine/debug-ui"]

[dependencies]
engine = { workspace = true, features = ["client"] }
shared.workspace = true
server.workspace = true
rendezvous.workspace = true
glam.workspace = true
winit.workspace = true
serde.workspace = true
ron.workspace = true
bincode.workspace = true
renet.workspace = true
renet_netcode.workspace = true
# netcode protocol core: our transports wrap it directly so the network simulator can sit
# between the UDP socket and netcode (see docs/network.md).
renetcode = "2"
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
# The update check (src/update): GitHub's releases API and downloads over HTTPS, on a
# background thread. rustls with the ring provider and bundled Mozilla roots: no OpenSSL (the
# Linux binary would need the distro's libssl) and no aws-lc-rs (cmake / nasm to cross-compile
# for Windows).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
serde_json = "1"
sha2 = "0.10"
